<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>LarpCity</title>
<style>
  :root{
    --bg-app: #1e1f22;
    --bg-sidebar: #2b2d31;
    --bg-header: #313338;
    --bg-input: #383a40;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --text-main: #f2f3f5;
    --text-muted: #949ba4;
    --text-faint: #6d6f78;
    --divider: #26272b;
    --danger: #da373c;
    --online: #23a55a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-app);
    color: var(--text-main);
    overflow:hidden;
    user-select:none;
  }
  input, textarea{ user-select:text; }
  #root{height:100vh;width:100%;}

  .login-overlay{
    position:fixed; inset:0; background:var(--bg-app);
    display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    background:var(--bg-sidebar);
    border-radius:8px;
    padding:32px 28px;
    width:340px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
    text-align:center;
  }
  .login-card h1{ font-size:20px; margin:0 0 6px 0; }
  .login-card p{ font-size:13px; color:var(--text-muted); margin:0 0 4px 0; }
  .login-card .server-line{ font-size:11px; color:var(--text-faint); margin-bottom:18px; word-break:break-all; }
  .login-card input{
    width:100%; padding:10px 12px; border-radius:4px;
    border:1px solid var(--divider); background:#1e1f22; color:var(--text-main);
    font-size:14px; outline:none; margin-bottom:14px;
  }
  .login-card input:focus{ border-color: var(--accent); }
  .login-card button{
    width:100%; padding:10px; border:none; border-radius:4px;
    background:var(--accent); color:white; font-weight:600; font-size:14px; cursor:pointer;
  }
  .login-card button:hover{ background:var(--accent-hover); }
  .login-card button:disabled{ opacity:0.5; cursor:default; }
  .login-error{ color:var(--danger); font-size:12px; margin-bottom:10px; min-height:14px; }

  .app{ display:flex; height:100%; }
  .sidebar{
    width:232px; background:var(--bg-sidebar); display:flex; flex-direction:column;
    flex-shrink:0; border-right:1px solid var(--divider);
  }
  .sidebar-header{
    padding:16px 16px 8px 16px; font-size:11px; letter-spacing:0.03em;
    color:var(--text-faint); text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center;
  }
  .sidebar-header .add-btn{ cursor:pointer; color:var(--text-muted); font-size:16px; padding:0 4px; }
  .sidebar-header .add-btn:hover{ color:var(--text-main); }
  .room-list{ flex:1; overflow-y:auto; padding:0 8px; }
  .room-item{
    display:flex; align-items:center; gap:6px; padding:8px 10px; margin-bottom:2px;
    border-radius:4px; color:var(--text-muted); font-size:15px; cursor:pointer;
  }
  .room-item:hover{ background:#35373c; color:var(--text-main); }
  .room-item.active{ background:#404249; color:var(--text-main); }
  .room-hash{ color:var(--text-faint); font-weight:600; }
  .room-item.active .room-hash{ color:var(--text-muted); }

  .sidebar-divider{ height:1px; background:var(--divider); margin:6px 12px; flex-shrink:0; }
  .friend-section{ flex-shrink:0; max-height:34%; display:flex; flex-direction:column; }
  .friend-list{ overflow-y:auto; padding:0 8px 6px 8px; }
  .friend-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:2px; border-radius:4px; font-size:13px; }
  .friend-item:hover{ background:#35373c; }
  .friend-item:hover .friend-remove{ visibility:visible; }
  .friend-mini-avatar{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:10px; color:white; flex-shrink:0; }
  .friend-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-main); }
  .mutual-badge{ font-size:9px; color:#57f287; border:1px solid #2f5c3c; background:#1c3324; padding:1px 5px; border-radius:8px; flex-shrink:0; }
  .friend-remove{ visibility:hidden; cursor:pointer; color:var(--text-faint); font-size:14px; padding:0 2px; }
  .friend-remove:hover{ color:var(--danger); }
  .friend-empty{ padding:4px 8px 10px 8px; font-size:12px; color:var(--text-faint); }

  .user-bar{ padding:10px 12px; background:#232428; display:flex; align-items:center; gap:8px; border-top:1px solid var(--divider); }
  .user-avatar{ width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:white; flex-shrink:0; position:relative; }
  .status-dot{ position:absolute; bottom:-2px; right:-2px; width:11px; height:11px; border-radius:50%; border:2px solid #232428; background:var(--danger); }
  .status-dot.online{ background:var(--online); }
  .user-name{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .user-sub{ font-size:11px; color:var(--text-faint); }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-header{ height:48px; display:flex; align-items:center; padding:0 16px; background:var(--bg-header); border-bottom:1px solid var(--divider); flex-shrink:0; }
  .chat-header .room-hash{ font-size:18px; margin-right:6px; }
  .chat-header .room-title{ font-weight:700; font-size:15px; }

  .messages{ flex:1; overflow-y:auto; padding:16px 16px 8px 16px; display:flex; flex-direction:column; }
  .empty-state{ margin:auto; text-align:center; color:var(--text-faint); font-size:13px; max-width:280px; }
  .empty-state .big-hash{ font-size:40px; margin-bottom:8px; }

  .msg-group{ display:flex; gap:12px; padding:6px 4px; border-radius:4px; }
  .msg-group:hover{ background:#2e3035; }
  .msg-avatar{ width:36px; height:36px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:white; flex-shrink:0; margin-top:2px; }
  .msg-body{ min-width:0; flex:1; }
  .msg-head{ display:flex; align-items:baseline; gap:8px; }
  .msg-author{ font-size:14px; font-weight:600; }
  .msg-time{ font-size:11px; color:var(--text-faint); }
  .msg-text{ font-size:14px; color:#dbdee1; line-height:1.4; word-wrap:break-word; white-space:pre-wrap; }

  .composer{ padding:0 16px 20px 16px; flex-shrink:0; }
  .composer-inner{ background:var(--bg-input); border-radius:8px; display:flex; align-items:flex-end; padding:6px 10px; }
  .composer textarea{ flex:1; background:transparent; border:none; outline:none; resize:none; color:var(--text-main); font-size:14px; font-family:inherit; padding:8px 4px; max-height:120px; line-height:1.4; }
  .composer textarea::placeholder{ color:var(--text-faint); }
  .composer .send-btn{ background:transparent; border:none; color:var(--text-faint); cursor:pointer; padding:6px 8px; font-size:13px; font-weight:600; }
  .composer .send-btn.active{ color:var(--accent); }
  .composer .send-btn.active:hover{ color:var(--accent-hover); }

  .inline-row{ display:flex; gap:6px; padding:6px 8px 10px 8px; }
  .inline-row input{ flex:1; background:#1e1f22; border:1px solid var(--divider); border-radius:4px; color:var(--text-main); font-size:13px; padding:6px 8px; outline:none; }
  .inline-row input:focus{ border-color:var(--accent); }
  .inline-row button{ background:var(--accent); border:none; border-radius:4px; color:white; font-size:12px; font-weight:600; padding:0 10px; cursor:pointer; }
  .inline-row button:hover{ background:var(--accent-hover); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:#1a1b1e; border-radius:4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="renderer.js"></script>
</body>
</html>
